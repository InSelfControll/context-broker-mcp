[project]
name = "context-broker"
version = "0.4.0"
description = "MCP server for semantic code search, cross-chat memory, and token-slim routing — cut LLM token usage 80-95%, 100% local"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Context Broker Team"},
]
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "semantic-search",
    "code-search",
    "codebase-search",
    "rag",
    "context-engineering",
    "token-optimization",
    "llm-context",
    "ai-coding-assistant",
    "claude",
    "claude-code",
    "cursor",
    "codex",
    "kimi",
    "sentence-transformers",
    "fastmcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anyio>=4.0.0",
    # Pinned <4: fastmcp 4 / mcp 2.x moved to the 2026-07-28 protocol era, which
    # removes server-initiated elicitation (SEP-2322) and changes transport
    # envelopes — breaks delegation consent, history indexing consent, the
    # shared-service proxy, and the downstream MCP client. Migrate deliberately.
    "fastmcp>=3.1.1,<4",
    "filelock>=3.29.0",
    "json5>=0.12.0",
    "numpy>=2.4.3",
    "regex>=2026.5.9",
    "rich>=14.3.3",
    "ruamel-yaml>=0.18.10",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.3.0",
    "tiktoken>=0.12.0",
    "tomlkit>=0.13.3",
    "torch>=2.13.0",
    # CVE-2026-9856: tokenizer/processor save_pretrained path traversal.
    "transformers>=5.10.1",
]

[project.optional-dependencies]
integrations = [
    "honcho-ai>=2.1.1",
    "redis>=6.4.0",
]
dashboard = [
    "starlette>=1.3.1",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.15.0",
    "black>=26.3.0",
    "ruff>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/InSelfControll/context-broker-mcp"
Documentation = "https://github.com/InSelfControll/context-broker-mcp#readme"
Repository = "https://github.com/InSelfControll/context-broker-mcp"
Issues = "https://github.com/InSelfControll/context-broker-mcp/issues"

[project.scripts]
context-broker = "context_broker.__main__:main"
context-broker-dashboard = "context_broker.__main__:_run_dashboard"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["context_broker"]

[tool.black]
line-length = 100
target-version = ['py313']

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
